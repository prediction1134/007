    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .fast-badge {
            background: #ffcc00;
            color: #000;
            font-weight: 800;
            padding: 8px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Headline Blinking Animation */
        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.3; } 
        }
        .headline {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff0044;
            animation: blink 1s infinite;
            margin: 10px 0;
        }

        .offer-section {
            border: 2px dashed #00ffcc;
            padding: 20px;
            margin: 30px 0;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
        }

        /* Button Zooming & Blinking Animation */
        @keyframes buttonBlinkPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 15px rgba(37, 211, 102, 0.6);
            }
            50% {
                transform: scale(1.08);
                opacity: 0.4; /* Yahan se button blink aur fade hoga */
                box-shadow: 0 0 30px rgba(37, 211, 102, 1);
            }
        }

        .btn {
            background: #25d366;
            color: #fff;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            display: inline-block;
            text-transform: uppercase;
            /* Animation applied here */
            animation: buttonBlinkPulse 1.2s infinite ease-in-out; 
            transition: 0.2s;
        }

        /* Hover karne par animation stop ho jayegi taaki click karne me dikkat na ho */
        .btn:hover { 
            animation: none;
            transform: scale(1.1); 
            background: #128c7e; 
            opacity: 1;
            box-shadow: 0 0 25px #25d366;
        }
    </style>

<body>

    <div class="fast-badge">⚡ 100% SUPER FAST SITE</div>

    </div>

</body>
